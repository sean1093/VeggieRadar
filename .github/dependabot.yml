# Keeps the frontend toolchain and the workflow actions current. The frontend
# suite also evaluates every backend/*.gs, so a dependency bump that breaks
# either half is caught by the same CI run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors stay separate so a
      # breaking change (Vite 8, React 19, Tailwind 4 were all recent) is
      # reviewed on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript past typescript-eslint's peer bound is held, and not by
      # anything in this repo: typescript-eslint
      # THROWS on import under it ("typescript-eslint does not support TS 7.0"),
      # so the lint job cannot run at all, and its peer range is still
      # `typescript: >=4.8.4 <6.1.0` on both latest (8.70.1) and canary
      # (8.70.2-alpha.5). Everything else is ready: with `baseUrl` dropped from
      # tsconfig.app.json (TS 7 removed the option) the typecheck, all 616 tests
      # and the production build pass on 7.0.2.
      #
      # Without this, every TS 7 patch release reopens a PR that cannot merge
      # and burns a CI run proving it. Issue #83 is the reminder to delete this
      # block — check with `npm view typescript-eslint peerDependencies.typescript`.
      #
      # The bound mirrors that peer range rather than naming TS 7: a stable 6.0
      # would be supported and should flow through, while a 6.1 would hit the
      # same wall one major lower.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

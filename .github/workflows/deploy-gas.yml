name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**' # Apps Script source
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `secrets` may only be referenced inside `env`/`run`, never in an `if`.
    # Map them to booleans so steps can gate on `env`.
    env:
      HAS_SA: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_TOKEN: ${{ secrets.CLASP_TOKEN != '' }}
      # The live Web App deployment the frontend calls (public; also in frontend/.env).
      DEPLOYMENT_ID: AKfycbyKixQhgD42GXjZePZB6P62_LXmNqKZ0vtepsu1wTvw9LZXwv3GAIRIa6c8Hqu92EcM
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22+: the test suite uses Promise.withResolvers; matches ci.yml
          # and deploy-pages.yml.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Run backend regression tests
        # backendCode.test.ts evaluates every backend/*.gs with stubbed GAS
        # services; a red suite must block the clasp push below.
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run

      - name: Authenticate clasp (Service Account)
        # RECOMMENDED: store the service-account JSON key as secret GCP_SA_KEY.
        if: env.HAS_SA == 'true'
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > ./gcp-sa-key.json
          clasp login --creds ./gcp-sa-key.json

      - name: Authenticate clasp (Refresh Token)
        # ALTERNATIVE: store the refresh_token from ~/.clasprc.json as secret CLASP_TOKEN.
        if: env.HAS_SA != 'true' && env.HAS_TOKEN == 'true'
        run: |
          echo '{ "token": { "access_token": "dummy", "refresh_token": "${{ secrets.CLASP_TOKEN }}", "token_type": "Bearer", "expiry_date": 1 } }' > ~/.clasprc.json

      - name: Push to Apps Script Project
        # .clasp.json lives at the repo root and points rootDir to backend/.
        if: env.HAS_SA == 'true' || env.HAS_TOKEN == 'true'
        run: clasp push --force

      - name: Redeploy the Web App
        # `clasp push` only moves HEAD. The /exec URL serves a pinned version, so
        # without this the deployed backend silently keeps running the old code.
        if: env.HAS_SA == 'true' || env.HAS_TOKEN == 'true'
        run: clasp deploy -i "$DEPLOYMENT_ID" -d "ci ${GITHUB_SHA::7}"

      - name: Queue a board refresh
        # Non-blocking: the endpoint schedules the crawl and returns at once.
        # `force=1` jumps the 15-minute lock and is honoured only with the
        # operator token (the ADMIN_TOKEN script property, mirrored in the
        # GAS_ADMIN_TOKEN secret). Without the secret the call still queues a
        # refresh, subject to the lock.
        #
        # Apps Script always answers HTTP 200, so `-f` proves nothing: the
        # body is checked instead. `forced: false` with the secret set means
        # the secret and the script property have drifted apart — fail loudly
        # here rather than let the new deploy serve the old board for another
        # 15 minutes. The body carries the board summary, never the token.
        if: env.HAS_SA == 'true' || env.HAS_TOKEN == 'true'
        env:
          GAS_ADMIN_TOKEN: ${{ secrets.GAS_ADMIN_TOKEN }}
        run: |
          base="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          if [ -n "$GAS_ADMIN_TOKEN" ]; then
            body=$(curl -fsSL --max-time 60 -G "$base" \
              --data-urlencode action=warm --data-urlencode force=1 \
              --data-urlencode "token=$GAS_ADMIN_TOKEN")
            echo "$body" | jq -e '.type == "warm" and .forced == true' > /dev/null \
              || { echo "::error::warm was not accepted as the operator — GAS_ADMIN_TOKEN and the ADMIN_TOKEN script property differ, or doGet failed: $body"; exit 1; }
          else
            echo "GAS_ADMIN_TOKEN not set — queuing a refresh without force"
            body=$(curl -fsSL --max-time 60 -G "$base" --data-urlencode action=warm)
            echo "$body" | jq -e '.type == "warm"' > /dev/null \
              || { echo "::error::warm did not answer as expected: $body"; exit 1; }
          fi
          echo "$body" | jq -c '{queued, forced, message}'

      - name: Skip notice
        if: env.HAS_SA != 'true' && env.HAS_TOKEN != 'true'
        run: echo "No GCP_SA_KEY or CLASP_TOKEN secret set — skipping GAS deploy. Deploy the backend manually with 'clasp push' + 'clasp deploy'."

name: CI

# Test gate for every pull request. Pushes to the default branch are gated
# inside the deploy workflows themselves (deploy-pages / deploy-gas run the
# suite before publishing), so running this job there too would duplicate
# the same install + test + build on every push.
# The frontend suite includes backendCode.test.ts, which evaluates every
# backend/*.gs against stubbed GAS services — one job covers both halves.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Typecheck and build
        run: npm run build

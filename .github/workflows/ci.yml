name: CI

# Test gate for every pull request. Pushes to the default branch are gated
# inside the deploy workflows themselves (deploy-pages / deploy-gas run the
# suite before publishing), so running this job there too would duplicate
# the same install + test + build on every push.
# The frontend suite includes backendCode.test.ts, which evaluates every
# backend/*.gs against stubbed GAS services — one job covers both halves.
# `tools/calibrate` is a separate package with its own lockfile, so it gets a
# job of its own. Its tests otherwise ran only inside the monthly refit, which
# is the worst moment to learn that a rule changed: a refit is unattended, it
# opens a PR against `RetailCalibration.gs`, and the run that would have caught
# the change is the same run it has to fail.
# `tools/region-spread` is the same shape and gets the same treatment. It is
# run by hand, so without a job its tests would only ever run when someone
# happened to remember — and what they pin is what may be written into its
# cache, which is exactly the class of bug that survives being forgotten.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Typecheck and build
        run: npm run build

  calibrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/calibrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/calibrate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  region-spread:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/region-spread
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/region-spread/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

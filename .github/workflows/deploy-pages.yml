name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  # The board mirror (README §2) is only as fresh as the last deploy, so the
  # deploy runs when a crawl lands — and on a clock as the fallback.
  #
  # This is the mechanism that carries mirror freshness (#68): after a
  # successful `refreshBoardCache()` the backend POSTs `board-crawled` to
  # `/dispatches`, and the mirror is published minutes after the board it
  # mirrors exists. API-triggered runs are not subject to the schedule
  # throttling measured below. It is a no-op until the `GH_DISPATCH_TOKEN`
  # script property is set, which is why the schedule stays.
  repository_dispatch:
    types: [board-crawled]
  schedule:
    # Measured twice, and the experiment is over.
    #
    # What this cron asks for and what GitHub runs are different numbers. Over
    # the 222 h to 2026-09-16, `20 */2 * * *` asked for ~111 runs and GitHub
    # created 46: a median gap of 4.5 h and a worst of 11.2 h, with none
    # cancelled or skipped — the ticks were simply never created. #67 then
    # asked hourly for a week to tell a ~59 % drop rate from an effective
    # floor near 4 h. Over the 137 h to 2026-09-21 that produced 33 successful
    # runs: a median gap of 4.64 h, a worst of 7.34 h, a best of 2.07 h.
    #
    # The median did not move. Twelve times the ticks for a quarter of the
    # runs is a throttle, not a lottery, so the cron is back where it was: the
    # extra asks bought deploys and nothing else. The tail did improve
    # (11.2 h → 7.3 h), which is worth having but is not what the mirror's age
    # turns on.
    #
    # So the schedule is now the FALLBACK, not the mechanism. The dispatch
    # above collapses both terms of mirror age — the board's age when the
    # deploy ran, and everything since — leaving it bounded by the backend's
    # own 4 h refresh cycle, inside the client's 6 h authority window and the
    # probe's 8 h bound. With no token set, this 2-hourly schedule is exactly
    # what it was before the experiment.
    #
    # To re-measure, count runs that PUBLISHED, not runs that were created —
    # with `cancel-in-progress: false` a tick can be cancelled while pending,
    # which would shrink the median while republishing nothing:
    #   gh api --paginate \
    #     '/repos/{owner}/{repo}/actions/workflows/deploy-pages.yml/runs?event=schedule&status=success&per_page=100' \
    #     | jq -s '[.[].workflow_runs[].created_at] | sort'
    # Pipe to `jq -s`, do not reach for `--jq`: gh applies that per page, so a
    # week of runs comes back as two separately sorted arrays with a bogus gap
    # at the seam. `--slurp` would fix that but gh refuses it alongside
    # `--jq`. Filter `event=schedule` to keep dispatch-triggered runs out of a
    # number that is about the scheduler.
    #
    # Each run still installs, lints and runs the full suite before
    # publishing. Skipping that on scheduled runs would save free minutes and
    # open a hole: a master whose own deploy failed on a red test would be
    # published by the next tick.
    - cron: '20 */2 * * *'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel in flight: the only thing a cancellation
# buys is skipping an already-obsolete build, and the thing it risks is killing
# a run inside `actions/deploy-pages`. GitHub's own Pages starter workflow pins
# this to false for that reason, and a shorter cron interval only raises the
# odds of a scheduled tick landing on a push deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Bounded because `cancel-in-progress` is false: a hung run holds the
    # `pages` group, and every tick that queues behind it is cancelled while
    # pending. The group is held for the whole workflow, so the two jobs'
    # timeouts add up — half an hour here, against the 12 h two jobs at the 6 h
    # default would allow. The suite and build take about two minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        # Deploys must never outrun the suite — a red test blocks the publish.
        run: npm run test:run

      - name: Fetch board mirror
        # Publishes `data/board.json` next to the app so the board — 99 % of
        # the traffic — is read from the same CDN instead of costing a GAS
        # execution and a cold start (README §2). The URL is read from the
        # committed `frontend/.env`: `/exec` is public by construction, since
        # the browser calls it and Vite inlines it into the bundle.
        #
        # A GAS outage must never block a code deploy, so every failure here
        # falls back: first to the mirror already published (stale prices the
        # client will still send to GAS), then to no mirror at all (the client
        # goes straight to GAS, exactly as it did before this step existed).
        #
        # Both fetches go through `scripts/fetch-retry.mjs`, the probe's retry
        # policy (`gas-retry.mjs`): three attempts, 2 s then 4 s apart, for a
        # 404, a 5xx or a timeout; a 200 is never retried, whatever its body,
        # because that is the validator's question (an empty one is refused). One attempt is how the
        # mirror froze for a whole day on 2026-09-13 (#53): Apps Script
        # answered each scheduled fetch with its cold-start 404 — after queueing
        # the request for ~15 s — and every run "succeeded" by republishing the
        # same 04:22 board while GAS itself was healthy throughout. The reuse
        # fetch retries too: its failure mode is a site with no mirror at all,
        # which is worse than a stale one.
        env:
          MIRROR_URL: https://sean1093.github.io/VeggieRadar/data/board.json
        run: |
          set -uo pipefail
          api_base="$(sed -n 's/^[[:space:]]*VITE_API_BASE_URL[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*$/\1/p' .env)"
          mkdir -p public/data
          mirror=none
          reason=

          if [ -z "$api_base" ]; then
            reason='VITE_API_BASE_URL missing from frontend/.env'
          elif ! fetched="$(node scripts/fetch-retry.mjs "${api_base}?action=board" /tmp/board.json)"; then
            reason="GAS fetch failed: $fetched"
          elif ! verdict="$(node --experimental-strip-types scripts/validate-board.mjs /tmp/board.json 2>&1)"; then
            reason="$verdict"
          else
            cp /tmp/board.json public/data/board.json
            mirror=fresh
            reason="$verdict ($fetched)"
          fi

          if [ "$mirror" = none ]; then
            # The published mirror is this workflow's own last output, already
            # validated when it was written. It is deliberately NOT re-validated
            # here: it is reused *because* it is the best available, and its age
            # is the one thing this branch already knows is wrong.
            # `static`: on Pages a 404 means "nothing published", final — only
            # a 5xx or a dead connection is retried, so the summary never
            # reports a CDN blip that was really an absent file.
            if reused="$(node scripts/fetch-retry.mjs "$MIRROR_URL" public/data/board.json static)"; then
              mirror='reused (stale)'
              reason="$reason; reused the published mirror ($reused)"
            else
              rm -f public/data/board.json
              reason="$reason; no published mirror to reuse ($reused) — the client falls back to GAS"
            fi
          fi

          # To the log as well as the step summary: the summary is not reachable
          # through the API, and "which branch did this run take" is the first
          # question when the mirror goes stale.
          printf 'mirror: %s\n\nreason: %s\n' "$mirror" "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build (embeds VITE_API_BASE_URL from frontend/.env)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Same reason as `build`, and the likelier place to hang: this job is one
    # call into `actions/deploy-pages`, which waits on GitHub's own Pages API.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

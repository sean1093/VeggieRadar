name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  # The board mirror (README §2) is only as fresh as the last deploy, so the
  # deploy also runs on a clock of its own.
  schedule:
    # Every two hours, not four. The backend's refresh trigger is installed by
    # hand (`installDailyTrigger()`), so its 4-hourly phase is arbitrary: a
    # 4-hourly fetch lands a fixed number of minutes before it forever and
    # mirrors a board that is already ~4 h old. Production proved it — the
    # probe opened issue #42 with a mirror 8.4 h old while GAS held one 0.4 h
    # old. At this cadence the mirror trails the backend by at most ~2 h, which
    # keeps it inside the client's 6 h authority window and the probe's 8 h
    # bound whatever the trigger's phase. 12 Pages deploys a day, against a
    # soft limit of 10 per hour.
    - cron: '20 */2 * * *'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        # Deploys must never outrun the suite — a red test blocks the publish.
        run: npm run test:run

      - name: Fetch board mirror
        # Publishes `data/board.json` next to the app so the board — 99 % of
        # the traffic — is read from the same CDN instead of costing a GAS
        # execution and a cold start (README §2). The URL is read from the
        # committed `frontend/.env`: `/exec` is public by construction, since
        # the browser calls it and Vite inlines it into the bundle.
        #
        # A GAS outage must never block a code deploy, so every failure here
        # falls back: first to the mirror already published (stale prices the
        # client will still send to GAS), then to no mirror at all (the client
        # goes straight to GAS, exactly as it did before this step existed).
        #
        # The GAS request RETRIES, on the same terms as the production probe
        # (`scripts/gas-retry.mjs`): Apps Script answers a cold start with a
        # 404 — after queueing the request for ~15 s, in practice — and one
        # attempt at :20 past every other hour hit exactly that all day on
        # 2026-09-13, so every run "succeeded" by republishing the same
        # 04:22 board until the probe paged (#53). `--retry-all-errors` is
        # what makes curl retry an HTTP error under `-f` (404, 5xx) as well as
        # a timeout; a 200 is never an error, so a bad body still goes to the
        # validator once and is judged, not retried. No `--retry-delay`, so
        # curl backs off 1 s, 2 s, 4 s between the three retries.
        run: |
          set -uo pipefail
          api_base="$(sed -n 's/^[[:space:]]*VITE_API_BASE_URL[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*$/\1/p' .env)"
          mkdir -p public/data
          mirror=none
          reason=

          if [ -z "$api_base" ]; then
            reason='VITE_API_BASE_URL missing from frontend/.env'
          elif ! curl -fsSL --max-time 30 --retry 3 --retry-all-errors --retry-max-time 150 \
                 "${api_base}?action=board" -o /tmp/board.json; then
            reason='GAS fetch failed (curl, after 4 attempts)'
          elif ! verdict="$(node --experimental-strip-types scripts/validate-board.mjs /tmp/board.json 2>&1)"; then
            reason="$verdict"
          else
            cp /tmp/board.json public/data/board.json
            mirror=fresh
            reason="$verdict"
          fi

          if [ "$mirror" = none ]; then
            # The published mirror is this workflow's own last output, already
            # validated when it was written. It is deliberately NOT re-validated
            # here: it is reused *because* it is the best available, and its age
            # is the one thing this branch already knows is wrong.
            if curl -fsSL --max-time 30 https://sean1093.github.io/VeggieRadar/data/board.json -o public/data/board.json; then
              mirror='reused (stale)'
            else
              rm -f public/data/board.json
              reason="$reason; no published mirror to reuse — the client falls back to GAS"
            fi
          fi

          # To the log as well as the step summary: the summary is not reachable
          # through the API, and "which branch did this run take" is the first
          # question when the mirror goes stale.
          printf 'mirror: %s\n\nreason: %s\n' "$mirror" "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build (embeds VITE_API_BASE_URL from frontend/.env)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
